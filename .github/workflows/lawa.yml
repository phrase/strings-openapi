name: License Check
on: push
jobs:
  lawa-npm-ci:
    name: NPM license checks
    uses: phrase/actions/.github/workflows/lawa-npm-ci.yml@5de107f3791db1fd25c83d4bea22bad7ad00c274 # phrase/actions#41
    with:
      node-version: "24.14.1"
      decisions-file: config/license-decisions.yml
    secrets:
      github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
