name: License Check
on: push
jobs:
  lawa-npm-ci:
    name: NPM license checks
    uses: phrase/actions/.github/workflows/lawa-npm-ci.yml@c3d58738c105564266452945b38fc074e91c3e15 # phrase/actions#40
