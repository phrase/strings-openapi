name: License Check
on: push
jobs:
  lawa-npm-ci:
    name: NPM license checks
    uses: phrase/actions/.github/workflows/lawa-npm-ci.yml@ad0e5ea2c97fb2705dfea691a7a84334c3d3b1b3 # phrase/actions main (#40)
    with:
      node-version: "24.14.1"
      decisions-file: config/license-decisions.yml
    secrets:
      github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
