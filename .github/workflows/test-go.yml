name: Run Go Tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.27.1'
      - name: Run Tests
        run: |
          npm install
          npm run generate.go
          cd ./clients/go
          go test ./... -v
      - name: License check
        uses: phrase/actions/lawa-ci@ad0e5ea2c97fb2705dfea691a7a84334c3d3b1b3 # phrase/actions main (#40)
        with:
          github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
          decisions-file: .license-decisions.yml
          working-directory: clients/go
          package-managers: gomodules
