name: Run Go Tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.27.1'
      - name: Run Tests
        run: |
          npm install
          npm run generate.go
          cd ./clients/go
          go test ./... -v
      - name: License check
        uses: phrase/actions/lawa-ci@c3d58738c105564266452945b38fc074e91c3e15 # phrase/actions#40
        with:
          github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
          decisions-file: .license-decisions.yml
          working-directory: clients/go
          package-managers: gomodules
