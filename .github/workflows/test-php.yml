name: Run PHP Tests
on: [push]
jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install
          npm run generate.php
      - uses: php-actions/composer@v6
        with:
          php_version: '8.3'
          working_dir: ./clients/php
      - uses: php-actions/phpunit@v3
        with:
          php_version: '8.3'
          version: '12.1'
          configuration: ./clients/php/phpunit.xml.dist
      - name: License check
        uses: phrase/actions/lawa-ci@d2b850633ae97af7b9e7507bdb8ed8c8e2f3da5d # main, includes setup-ruby v1.335.0
        with:
          github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
          decisions-file: .license-decisions.yml
          working-directory: clients/php
          package-managers: composer
