name: Run Ruby Tests
on: [push]
jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install
          npm run generate.ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
          working-directory: ./clients/ruby
      - name: Run tests
        run: |
          cd ./clients/ruby
          bundle exec rspec
      - name: Check licenses
        uses: phrase/actions/lawa-ruby-ci@main
        with:
          working-directory: ./clients/ruby
          github-token: ${{ secrets.GH_LAWA_ACCESS_TOKEN }}
