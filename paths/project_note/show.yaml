---
summary: Get a project note
description: |
  Returns the Markdown-formatted note attached to a project. The note is
  resolved against the main project — branch projects return the main
  project's note. Available only when the `project_notes` feature is
  enabled for the account; returns 404 when the feature is disabled or
  when no note has been created yet. Requires the `read` OAuth scope.
operationId: project_note/show
tags:
  - Project Notes
parameters:
  - "$ref": "../../parameters.yaml#/X-PhraseApp-OTP"
  - "$ref": "../../parameters.yaml#/project_id"
  - "$ref": "../../parameters.yaml#/branch"
responses:
  '200':
    description: OK
    headers:
      X-Rate-Limit-Limit:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Limit"
      X-Rate-Limit-Remaining:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Remaining"
      X-Rate-Limit-Reset:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Reset"
    content:
      application/json:
        schema:
          "$ref": "../../schemas/note.yaml#/note"
  '400':
    "$ref": "../../responses.yaml#/400"
  '401':
    "$ref": "../../responses.yaml#/401"
  '403':
    "$ref": "../../responses.yaml#/403"
  '404':
    "$ref": "../../responses.yaml#/404"
  '429':
    "$ref": "../../responses.yaml#/429"
