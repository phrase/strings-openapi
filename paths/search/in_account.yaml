---
summary: Search translations and keys across projects
description: |
  Search for translation keys and translations across every project the user can access in the account. Optionally narrow the search to a subset of projects using `project_ids`.

  *Note: Search is limited to 10000 results and may not include recently updated data depending on the project sizes.*
operationId: search/in_account
tags:
- Translations
parameters:
- "$ref": "../../parameters.yaml#/X-PhraseApp-OTP"
- "$ref": "../../parameters.yaml#/account_id"
- description: Search query, matched against both translation content and key names.
  example: keyword
  name: query
  in: query
  required: false
  schema:
    type: string
- description: Restrict results to translations in this locale.
  example: de_DE
  name: locale_code
  in: query
  required: false
  schema:
    type: string
- description: |
    Restrict the search to the given project codes. When omitted, the search spans every project the user can access in this account.
  name: project_ids
  in: query
  required: false
  schema:
    type: array
    items:
      type: string
    example:
    - abcd1234abcd1234abcd1234abcd1234
- "$ref": "../../parameters.yaml#/page"
- "$ref": "../../parameters.yaml#/per_page"
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: array
          items:
            "$ref": "../../schemas/account_search_result.yaml#/account_search_result"
    headers:
      X-Rate-Limit-Limit:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Limit"
      X-Rate-Limit-Remaining:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Remaining"
      X-Rate-Limit-Reset:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Reset"
      Pagination:
        "$ref": "../../headers.yaml#/Pagination"
  '400':
    "$ref": "../../responses.yaml#/400"
  '404':
    "$ref": "../../responses.yaml#/404"
  '401':
    "$ref": "../../responses.yaml#/401"
  '403':
    "$ref": "../../responses.yaml#/403"
    description: Forbidden. Returned when the access token lacks the `read` scope or when the requesting user does not belong to this account.
  '429':
    "$ref": "../../responses.yaml#/429"
x-code-samples:
- lang: Curl
  source: |-
    curl "https://api.phrase.com/v2/accounts/:account_id/search?query=keyword&locale_code=de_DE&page=1&per_page=25" \
      -u USERNAME_OR_ACCESS_TOKEN \
      -X POST
- lang: CLI v2
  source: |-
    phrase search in_account \
    --account_id <account_id> \
    --data '{"query":"keyword","locale_code": "de_DE","page": 1,"per_page": 25}' \
    --access_token <token>
x-cli-version: '2.5'
