---
summary: List all translations
description: |
  List translations for the given project. If you want to download all translations for one locale we recommend to use the `locales#download` endpoint.
operationId: translations/list
tags:
- Translations
parameters:
- "$ref": "../../parameters.yaml#/X-PhraseApp-OTP"
- "$ref": "../../parameters.yaml#/If-Modified-Since"
- "$ref": "../../parameters.yaml#/If-None-Match"
- "$ref": "../../parameters.yaml#/project_id"
- "$ref": "../../parameters.yaml#/page"
- "$ref": "../../parameters.yaml#/per_page"
- description: specify the branch to use
  example: my-feature-branch
  name: branch
  in: query
  schema:
    type: string
- description: |-
    Filter translations to those attached to the key identified by this code. Equivalent to calling `GET /projects/{project_id}/keys/{key_id}/translations`.
  name: key_id
  in: query
  example: abcd1234cdef1234abcd1234cdef1234
  schema:
    type: string
- description: |-
    Filter translations to those for the given locale (locale code or id). Equivalent to calling `GET /projects/{project_id}/locales/{locale_id}/translations`.
  name: locale_id
  in: query
  example: abcd1234cdef1234abcd1234cdef1234
  schema:
    type: string
- description: 'Sort criteria. Can be one of: key_name, created_at, updated_at.'
  example: updated_at
  name: sort
  in: query
  schema:
    type: string
- description: 'Order direction. Can be one of: asc, desc.'
  example: desc
  name: order
  in: query
  schema:
    type: string
- "$ref": "../../parameters.yaml#/translations_q"
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: array
          items:
            "$ref": "../../schemas/translation.yaml#/translation"
    headers:
      X-Rate-Limit-Limit:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Limit"
      X-Rate-Limit-Remaining:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Remaining"
      X-Rate-Limit-Reset:
        "$ref": "../../headers.yaml#/X-Rate-Limit-Reset"
      Link:
        "$ref": "../../headers.yaml#/Link"
      Pagination:
        "$ref": "../../headers.yaml#/Pagination"
  '400':
    "$ref": "../../responses.yaml#/400"
  '404':
    "$ref": "../../responses.yaml#/404"
  '401':
    "$ref": "../../responses.yaml#/401"
  '403':
    "$ref": "../../responses.yaml#/403"
    description: Forbidden. Returned when the access token lacks the `read` scope or when the requesting user is not allowed to read translations in this project.
  '429':
    "$ref": "../../responses.yaml#/429"
x-code-samples:
- lang: Curl
  source: |-
    curl "https://api.phrase.com/v2/projects/:project_id/translations?branch=my-feature-branch&sort=updated_at&order=desc&q=PhraseApp*%2520unverified:true%2520excluded:true%2520tags:feature,center" \
      -u USERNAME_OR_ACCESS_TOKEN
- lang: CLI v2
  source: |-
    phrase translations list \
    --project_id <project_id> \
    --branch my-feature-branch \
    --sort updated_at \
    --order desc \
    --query 'PhraseApp*%20unverified:true%20excluded:true%20tags:feature,center' \
    --access_token <token>
x-cli-version: '2.6.4'
