---
translation_key:
  type: object
  title: translation_key
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    name_hash:
      type: string
    plural:
      type: boolean
    use_ordinal_rules:
      type: boolean
    tags:
      type: array
      items:
        type: string
    data_type:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    linked_key:
      description: |
        Describes this key's role in a parent–child link relationship.
        Only present in the response when `include_linked_keys=true` is passed.
        `null` when the key has no active link (either unlinked, or the parent
        has been deleted).
      type: object
      properties:
        role:
          type: string
          enum:
            - parent
            - child
          description: >
            Whether this key is the parent or the child in the link relationship.
        parent:
          description: >
            The parent key's public identifier and name. Set for child keys;
            `null` for parent keys.
          type: object
          properties:
            id:
              type: string
              description: The parent key's public identifier (code).
              example: "abc12345def67890abc12345def67890"
            name:
              type: string
              description: The parent key's name.
              example: "home.welcome.title"
        children_count:
          type: integer
          nullable: true
          description: >
            The number of linked child keys. Set for parent keys;
            `null` for child keys.
          example: 3
  example:
    id: abcd1234cdef1234abcd1234cdef1234
    name: home.index.headline
    description: My description for this key...
    name_hash: 1b31d2580ce324f246f66b3be00ed399
    plural: false
    use_ordinal_rules: false
    tags:
    - awesome-feature
    - needs-proofreading
    data_type: string
    created_at: '2015-01-28T09:52:53Z'
    updated_at: '2015-01-28T09:52:53Z'
