---
repo_sync_event:
  type: object
  title: repo_sync_event
  properties:
    id:
      type: string
    type:
      type: string
      enum: [import, export]
    created_at:
      type: string
      format: date-time
    status:
      type: string
      enum: [running, success, failure]
    pull_request_url:
      type: string
      description: URL of the pull request created on export
    auto_import:
      type: boolean
      description: Whether the import was triggered by the repo push event
    errors:
      description: List of error messages, in case of failure
      type: array
      items:
        type: string
    uploads:
      type: array
      nullable: true
      description: >
        The uploads associated with this import event, or `null` if no
        upload batch has been created yet. Each entry identifies a single
        file upload by its public code (`id`) and its current public
        state (`state`). Present on show responses only; absent from list
        responses.

        Possible `state` values: `initialized`, `waiting_for_preview`,
        `processing`, `success`, `error`.
      items:
        type: object
        properties:
          id:
            type: string
            description: The upload's public identifier (code).
            example: abcd1234
          state:
            type: string
            description: >
              The upload's current public state. Multiple internal
              processing states are collapsed to `processing`; both
              internal error states are collapsed to `error`.
            enum:
              - initialized
              - waiting_for_preview
              - processing
              - success
              - error
  example:
    type: import
    created_at: '2015-01-28T09:52:53Z'
    status: failure
    auto_import: true
    errors:
      - "Error message 1"
      - "Error message 2"
