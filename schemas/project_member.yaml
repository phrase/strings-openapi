---
project_member:
  type: object
  title: project_member
  properties:
    id:
      type: string
    email:
      type: string
    username:
      type: string
    name:
      type: string
    position:
      type: string
    role:
      type: string
    created_at:
      type: string
      format: date-time
    last_activity_at:
      type: string
      format: date-time
    permissions:
      type: object
    default_locale_codes:
      type: array
      items:
        type: string
    teams:
      type: array
      items:
        "$ref": "./team_short.yaml#/team_short"
    spaces:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          name:
            type: string
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          projects_count:
            type: integer
  example:
    id: acbdacbdacbdacbdacbdacbd
    email: foo@bar.com
    username: myname
    name: My Name
    position: Lead Developer
    role: Manager
    created_at: "2020-12-07T12:56:21Z"
    last_activity_at: "2020-12-09T12:56:21Z"
    permissions:
    - create_upload: true
      review_translations: true
    default_locale_codes:
    - en
    - fi
    teams:
    - id: "04d36d845576b9d494d05e0b70fe813c"
      name: "Team 1"
      created_at: "2020-12-07T12:56:21Z"
      updated_at: "2020-12-07T12:56:21Z"
    spaces:
    - id: "04d36d845576b9d494d05e0b70fe813b"
      name: "Space2"
      created_at: "2020-12-07T12:56:21Z"
      updated_at: "2020-12-07T12:56:21Z"
      projects_count: 1
